services:
  - type: web
    name: drifter-colyseus
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: DRIFTER_MAX_PLAYERS
        value: 4
      - key: DRIFTER_ALLOWED_ORIGINS
        value: "*"
