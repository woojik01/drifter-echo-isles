name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client:
    name: Client build and QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Check committed script cache keys for GitHub Pages
        run: node scripts/version-assets.mjs --check
      - name: Build Worker artifact
        run: bash scripts/build.sh
      - name: Validate Worker artifact
        run: node scripts/validate-artifact.mjs
      - name: Run client regression QA
        run: |
          set -euo pipefail
          node qa/check.cjs
          node qa/camp-network.cjs
          node qa/camp-polish.cjs
          node qa/early-inventory.cjs
          node qa/gamedistribution.cjs
          node qa/import.cjs
          node qa/input-fixes.cjs
          # Current multiplayer integration is covered by the Colyseus server tests.
          node qa/night-horde.cjs
          node qa/platform.cjs
          node qa/v151-regression.cjs
          node qa/v152-camp-navigation.cjs
          node qa/v153-ads-night.cjs
          node qa/v154-party-start.cjs
          node qa/worker.cjs

  server:
    name: Server build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
